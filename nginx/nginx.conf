worker_processes auto;
events {
    worker_connections 4096;
    multi_accept on;
}

http {
    upstream flask_app {
        least_conn;                     # load distribution strategy
        server web:5000 max_fails=3 fail_timeout=10s;
        # When docker compose scale is used, the service DNS round-robins.
        # least_conn + multiple replicas gives good distribution.
        keepalive 32;
    }

    # Basic rate limiting zones
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name _;
        client_max_body_size 20M;

        # Health check for the load balancer itself
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Stricter limit on login
        location /login {
            limit_req zone=login_limit burst=10 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 50;
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
